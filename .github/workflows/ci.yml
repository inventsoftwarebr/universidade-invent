name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    # Postgres real para os testes de integração do fluxo de aprendizagem.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prepare test database
        run: |
          psql "$DIRECT_URL" -f test/sql/supabase-stubs.sql
          pnpm db:migrate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres

      - name: Tests (unit + integração)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Drizzle schema sanity (generate, expect no diff)
        run: |
          pnpm db:generate
          if ! git diff --quiet db/migrations; then
            echo "::error::Schema drift detected. Run 'pnpm db:generate' and commit the migration."
            git diff db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
