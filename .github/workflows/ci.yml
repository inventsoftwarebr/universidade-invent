name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # TODO: re-add --frozen-lockfile assim que pnpm-lock.yaml for commitado.
      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Drizzle schema sanity (generate, expect no diff)
        run: |
          pnpm db:generate
          if ! git diff --quiet db/migrations; then
            echo "::error::Schema drift detected. Run 'pnpm db:generate' and commit the migration."
            git diff db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
